<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="agenda.css">
</head>
<body>

    <div id="pesquisa" class="pesquisa">
        <div class="campoPesq">
            <label>ID</label>
            <input type="radio" name="f_pesq" value="id">
        </div>
        <div class="campoPesq">
            <label>Nome</label>
            <input type="radio" name="f_pesq" value="nome" checked>
        </div>
        <div class="campoPesq">
            <label>Data Nascimento</label>
            <input type="radio" name="f_pesq" value="nasc">
        </div>
        <div class="campoPesq">
            <label>E-Mail</label>
            <input type="radio" name="f_pesq" value="email">
        </div>
        <div class="campoPesq">
            <label>Pesquisar</label>
            <input type="text" id="f_txtpesq" name="f_txtpesq">
        </div>
        <div class="campoPesq">
            <button id="btn_pesq" class="btn_geral">Pesquisar</button>
        </div>
    </div>

    <div id="dgv" class="dgv">
        <div id="resultado" class="resultado">
            <div id="titulos" class="titulos">
                    <div class="título c1">id</div>
                    <div class="título c2">nome</div>
                    <div class="título c3">celular</div>
                    <div class="título c4">email</div>
                    <div class="título c5">data</div>
            </div>
            <div id="dados" class="dados">
                <!-- <div class="linhadados">
                    <div class="coluna c1">id</div>
                    <div class="coluna c2">nome</div>
                    <div class="coluna c3">celular</div>
                    <div class="coluna c4">email</div>
                    <div class="coluna c5">data</div>
                </div> -->
            </div>
        </div>
    </div>

    <script src="pesquisar.js" type="module"></script>

</body>
</html>
